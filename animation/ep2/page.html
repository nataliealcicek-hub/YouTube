<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="anatomy.js"></script>
<script src="scenes.js"></script>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const W = cv.width, H = cv.height;

/* Scenes draw into an offscreen buffer, which is then composited through a
   colour grade. Doing the lift in one place keeps all twelve blocks
   consistent — retuning them individually would drift them apart. */
const off = document.createElement('canvas');
off.width = W; off.height = H;
const octx = off.getContext('2d', { alpha: false });
const GRADE = 'saturate(1.30) contrast(1.05) brightness(1.06)';

function renderFrame(sceneIndex, t) {
  octx.save();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = '#000';
  octx.fillRect(0, 0, W, H);
  SCENES[sceneIndex](octx, t, W, H);
  octx.restore();

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = GRADE;
  ctx.drawImage(off, 0, 0);
  ctx.filter = 'none';
  ctx.restore();
}

function frameJPEG(sceneIndex, t) {
  renderFrame(sceneIndex, t);
  return cv.toDataURL('image/jpeg', 0.94).split(',')[1];
}
window.__ready = true;
</script>
</body>
</html>
