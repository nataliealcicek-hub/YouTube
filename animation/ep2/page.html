<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="anatomy.js"></script>
<script src="scenes.js"></script>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const W = cv.width, H = cv.height;

function renderFrame(sceneIndex, t) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  SCENES[sceneIndex](ctx, t, W, H);
  ctx.restore();
}

function frameJPEG(sceneIndex, t) {
  renderFrame(sceneIndex, t);
  return cv.toDataURL('image/jpeg', 0.94).split(',')[1];
}
window.__ready = true;
</script>
</body>
</html>
