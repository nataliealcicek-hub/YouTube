<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRISM — Scroll Cinematic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Fixed HUD chrome — rebrand per site -->
  <nav class="hud">
    <span class="hud-brand">PRISM<span class="dim">/</span>STUDIO</span>
    <span class="hud-mid">CINEMATIC · SCROLL</span>
    <span class="hud-right">VOL. 01</span>
  </nav>

  <!-- Scrub section 1 -->
  <section class="cinematic" id="hero">
    <div class="sticky">
      <canvas></canvas>
      <div class="vignette"></div>

      <!-- Scroll-driven overlay copy. data-in/data-out are section progress windows (0–1). -->
      <div class="overlay">
        <h1 class="reveal-line" data-in="0.00" data-out="0.30">FIRST LINE.</h1>
        <h1 class="reveal-line" data-in="0.34" data-out="0.64">SECOND LINE.</h1>
        <h1 class="reveal-line" data-in="0.70" data-out="1.00">THIRD LINE.</h1>
      </div>

      <!-- Static HUD corners -->
      <div class="telemetry tl">SEQ <b>01</b></div>
      <div class="telemetry tr">SYS NOMINAL</div>
      <div class="telemetry bl" id="frame-readout">FRAME 000 / 000</div>
      <div class="telemetry br">1600 · Q88</div>

      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="scroll-hint">SCROLL ▾</div>
    </div>
  </section>

  <!-- Optional second scrub section: duplicate the block above with a new id,
       then add a matching entry to SCRUB_SECTIONS below. -->

  <!-- Landing panel. .reveal fades in on intersect; .stat-num counts up. -->
  <section class="outro">
    <h2 class="reveal">SYSTEMS NOMINAL</h2>
    <p class="reveal">Built with a scroll-scrubbed canvas frame sequence + Lenis smooth scroll.<br/>
       Swap the <code>frames/</code> folder to re-theme.</p>
    <div class="stats">
      <div class="stat"><span class="stat-num" data-count="179">0</span><span class="stat-label">FRAMES</span></div>
      <div class="stat"><span class="stat-num" data-count="60" data-suffix="FPS">0</span><span class="stat-label">PLAYBACK</span></div>
      <div class="stat"><span class="stat-num" data-count="4" data-suffix="K">0</span><span class="stat-label">SOURCE</span></div>
    </div>
  </section>

  <script src="https://unpkg.com/lenis@1.3.21/dist/lenis.min.js"></script>

  <!-- One entry per generated clip. Must be set BEFORE scroll-cinematic.js runs. -->
  <script>
    window.SCRUB_SECTIONS = [
      {
        section: "#hero",
        frameCount: 180,
        bg: "#02030a",
        framePath: (i) => `frames/hero/frame_${String(i).padStart(4, "0")}.jpg`
      }
    ];
  </script>

  <script src="scroll-cinematic.js"></script>

  <!-- Optional HUD readout for the first scrub section. Delete if not wanted. -->
  <script>
    (function () {
      const cfg = window.SCRUB_SECTIONS[0];
      const section = document.querySelector(cfg.section);
      const total = cfg.frameCount;
      const fill = document.getElementById("progress-fill");
      const readout = document.getElementById("frame-readout");
      if (!section || !fill || !readout) return;
      const pad = (n) => String(n).padStart(3, "0");
      let last = -1;
      (function tick() {
        const rect = section.getBoundingClientRect();
        const p = Math.min(Math.max(-rect.top / (rect.height - window.innerHeight), 0), 1);
        const idx = Math.min(total - 1, Math.floor(p * (total - 1)));
        if (idx !== last) {
          last = idx;
          fill.style.width = (p * 100).toFixed(2) + "%";
          readout.textContent = `FRAME ${pad(idx + 1)} / ${pad(total)}`;
        }
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
</html>
